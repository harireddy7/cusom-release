name: Cut Release Branch

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Current Release branch name (e.g. release/1.0.0)"
        required: true
      next_release:
        description: "Next dev release — plain (e.g. 2.0.0) or full (e.g. 2.0.0-dev.1)"
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      current_version: ${{ steps.versions.outputs.current_version }}
      rc_version: ${{ steps.versions.outputs.rc_version }}
      next_dev_version: ${{ steps.versions.outputs.next_dev_version }}

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup Node v24
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      # ------------------------------------------------------------
      # GUARD: Fail if release branch already exists
      # ------------------------------------------------------------
      - name: Guard against existing release branch
        run: |
          if git show-ref --verify --quiet "refs/remotes/origin/${{ inputs.release_branch }}"; then
            echo "ERROR: Release branch '${{ inputs.release_branch }}' already exists."
            exit 1
          fi

      # ------------------------------------------------------------
      # Compute versions and create release branch
      # ------------------------------------------------------------
      - name: Compute versions
        id: versions
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "CURRENT_VERSION: $CURRENT_VERSION"

          if [[ "$CURRENT_VERSION" != *"-dev."* ]]; then
            echo "ERROR: Expected a dev version, got $CURRENT_VERSION"
            exit 1
          fi

          BASE_VERSION="${CURRENT_VERSION%-dev.*}"
          echo "BASE_VERSION: $BASE_VERSION"

          RC_VERSION="${BASE_VERSION}-rc.1"
          echo "RC_VERSION: $RC_VERSION"

          # Normalize next_release: append -dev.1 if not already in x.y.z-dev.N format

          NEXT_RELEASE="${{ inputs.next_release }}"

          if [[ "$NEXT_RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            NEXT_DEV_VERSION="$NEXT_RELEASE"
            echo "Next release already in dev format: $NEXT_DEV_VERSION"
          else
            NEXT_DEV_VERSION="${NEXT_RELEASE}-dev.1"
            echo "Appended -dev.1 to next release: $NEXT_DEV_VERSION"
          fi

          echo "NEXT_DEV_VERSION: $NEXT_DEV_VERSION"

          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "rc_version=$RC_VERSION" >> "$GITHUB_OUTPUT"
          echo "next_dev_version=$NEXT_DEV_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        run: |
          git checkout -b "${{ inputs.release_branch }}"
          git push origin "${{ inputs.release_branch }}"

      - name: Create PR labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "dev" \
            --color "f9d0c4" \
            --description "PRs targeting the dev branch" \
            --force
          gh label create "${{ inputs.release_branch }}" \
            --color "f4de5f" \
            --description "PRs targeting the ${{ inputs.release_branch }} branch" \
            --force

  bump-rc-version:
    name: Bump RC version on release branch
    needs: [prepare]
    uses: ./.github/workflows/bump-version.yaml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      checkout_branch: ${{ inputs.release_branch }}
      version: ${{ needs.prepare.outputs.rc_version }}
      current_version: ${{ needs.prepare.outputs.current_version }}

  bump-dev-version:
    name: Bump dev to next version
    needs: [ prepare, bump-rc-version ]
    uses: ./.github/workflows/bump-version.yaml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
    with:
      checkout_branch: dev
      version: ${{ needs.prepare.outputs.next_dev_version }}
      current_version: ${{ needs.prepare.outputs.current_version }}
